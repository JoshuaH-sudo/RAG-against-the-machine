[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "42 Berlin RAG against the machine project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fire>=0.7.0",
  "pydantic>=2.11.0",
  "tqdm>=4.67.0",
  "torch>=2.6.0",
  "transformers>=4.51.0",
]

[dependency-groups]
dev = [
  "flake8>=7.2.0",
  "mypy>=1.17.0",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
